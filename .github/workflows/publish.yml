name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# npm trusted publishing: the workflow authenticates via OIDC, no NPM_TOKEN.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      # `prepublishOnly` runs `npm run build` (tsc + tsdown). No `--provenance`:
      # sigstore only signs builds from public repositories, and this repo is
      # private (org-visible).
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) TAG=rc ;;
            *) TAG=latest ;;
          esac
          echo "publishing $VERSION with dist-tag $TAG"
          npm publish --access public --tag "$TAG"
